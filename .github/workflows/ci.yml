name: CI
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Pruebas a ejecutar
        type: choice
        options: [cambios, completa]
        default: cambios
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias de los cambios
        if: inputs.suite == 'cambios'
        run: node --import tsx --test tests/document.test.ts tests/library.test.ts tests/defaults.test.ts
      - name: Todas las pruebas unitarias
        if: inputs.suite == 'completa'
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador de los cambios
        if: inputs.suite == 'cambios'
        run: npm run test:e2e -- --grep "carpetas anidadas|mover y copiar|fallo de escritura al mover|papelera de carpetas|zoom ampliado|apariencia predeterminada|Escape confirma|exporta mapas"
      - name: Todas las pruebas de navegador
        if: inputs.suite == 'completa'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-test-results
          retention-days: 7
          path: |
            playwright-report/
            test-results/
